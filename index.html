<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c12" />
    <title>Dots</title>
    <meta
      name="description"
      content="Draw a line through dots of one colour to pop them out of existence."
    />

    <link rel="canonical" href="https://gadgetoid.github.io/dots/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dots" />
    <meta property="og:title" content="Dots" />
    <meta
      property="og:description"
      content="Draw a line through dots of one colour to pop them out of existence."
    />
    <meta property="og:url" content="https://gadgetoid.github.io/dots/" />
    <meta property="og:image" content="https://gadgetoid.github.io/dots/screenshots/social.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A glowing chain drawn through four rows of coloured dots"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='9' cy='9' r='6' fill='%23b455e6'/%3E%3Ccircle cx='23' cy='9' r='6' fill='%233cc4ff'/%3E%3Ccircle cx='16' cy='23' r='6' fill='%23ffa640'/%3E%3C/svg%3E"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --below: 3.5rem;
      }
      html,
      body {
        height: 100%;
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        position: fixed;
        inset: 0;
        margin: 0;
        background: #0a0c12;
        color: #8b93ab;
        font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
        display: grid;
        grid-template-rows: 1fr auto;
        justify-items: center;
        align-items: center;
        overflow: hidden;
      }
      .stage {
        position: relative;
        width: min(100vw, calc((100vh - var(--below)) * 0.75));
        aspect-ratio: 600 / 800;
        max-height: 100%;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        -webkit-user-drag: none;
      }
      .speak {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .speak:focus-visible {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 2;
        width: auto;
        height: auto;
        margin: 0;
        padding: 12px 18px;
        clip-path: none;
        border-radius: 4px;
        font: inherit;
        font-size: 18px;
        color: #0a0c12;
        background: #6fd8ff;
        outline: 3px solid #fff;
      }
      .below {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px 18px;
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        font-size: 13px;
        line-height: 1.5;
        text-align: center;
      }
      .below a {
        color: inherit;
      }
      .below a:hover,
      .below a:focus-visible {
        color: #6fd8ff;
      }
      .below a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 3px;
      }
      .unsupported {
        display: grid;
        place-content: center;
        height: 100%;
        margin: 0;
        text-align: center;
        letter-spacing: 0.1em;
        font-size: 20px;
        line-height: 2.2;
      }
    </style>
  </head>
  <body>
    <button
      type="button"
      class="speak"
      id="speak"
      aria-pressed="false"
      aria-describedby="speakhelp"
    >
      Speak menus
    </button>
    <p class="speak" id="speakhelp">
      Turns on spoken menus, then moves to the game field. Move with the arrow keys, hold Space to
      gather dots of one colour and let go to pop them.
    </p>
    <div class="stage" id="screen">
      <canvas
        id="game"
        tabindex="0"
        role="application"
        aria-label="Dots game field"
        draggable="false"
      ></canvas>
    </div>
    <footer class="below">
      <span>
        <a href="https://github.com/Gadgetoid/dots" target="_blank" rel="noopener">Report a bug</a>
      </span>
      <span>
        Throw me a bone:
        <a href="https://github.com/sponsors/gadgetoid" target="_blank" rel="noopener">GitHub</a>,
        <a href="https://www.patreon.com/gadgetoid" target="_blank" rel="noopener">Patreon</a>
        or <a href="https://ko-fi.com/gadgetoid" target="_blank" rel="noopener">Ko-fi</a>
      </span>
    </footer>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
